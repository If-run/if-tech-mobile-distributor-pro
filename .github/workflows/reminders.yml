# FREE daily SMS reminders using GitHub Actions (no Firebase Blaze plan needed).
#
# Setup:
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#
# FIREBASE_SERVICE_ACCOUNT = the whole service-account JSON file content
#
# Notify.lk:
# NOTIFY_USER_ID
# NOTIFY_API_KEY
# NOTIFY_SENDER_ID

name: Daily SMS reminders

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC = 09:00 Sri Lanka time

  workflow_dispatch: {}     # Allows manual "Run workflow"

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Run SMS reminders
        run: node run-once.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFY_USER_ID: ${{ secrets.NOTIFY_USER_ID }}
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
          NOTIFY_SENDER_ID: ${{ secrets.NOTIFY_SENDER_ID }}
